name: Bug report
description: Something doesn't work as expected
title: 'fix: '
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Never paste a webhook URL or your .env here.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add this feed to feeds.yaml: ...
        2. Run ...
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines (check that no secret is included).
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / image tag
