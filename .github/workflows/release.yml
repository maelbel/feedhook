name: Release

# Publishing a version: tag main and push the tag.
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Same checks and image builds as on every pull request.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish image to GHCR
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # Only this job may write to the GitHub container registry.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The Dockerfile names an exact version (node:24.22.0-alpine). Here we
      # resolve it to its digest, so a released image is built from exactly
      # one base image, and record it in the job summary.
      - name: Pin the base image digest
        id: base
        run: |
          image=$(sed -n 's/^ARG NODE_IMAGE=//p' Dockerfile)
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r .digest)
          case "$digest" in sha256:*) ;; *) echo "could not resolve $image" >&2; exit 1 ;; esac
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
          echo "Base image: \`$image@$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          # The tag is the source of truth for the version: never `latest`
          # by accident from a branch.
          flavor: latest=auto

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: NODE_IMAGE=${{ steps.base.outputs.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Supply chain: a software bill of materials and build provenance
          # are attached to the image.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
